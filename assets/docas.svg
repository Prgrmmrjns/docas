<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="DOCAS">
  <defs>
    <linearGradient id="docas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#26C6A8"/>
      <stop offset="100%" stop-color="#00BFA5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="28" fill="#0F2430"/>

  <!-- baseline (confounded): rising -->
  <path d="M160 320 C 360 300, 560 250, 760 200 S 980 150, 1080 130"
        fill="none" stroke="#FF6E6E" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="14 12"/>

  <!-- aligned curve: lowering -->
  <path d="M160 180 C 360 185, 560 240, 760 310 S 980 370, 1080 390"
        fill="none" stroke="url(#docas)" stroke-width="9" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- synthetic dots -->
  <g>
    <circle cx="260" cy="182" r="11" fill="#8E66FF"/>
    <circle cx="420" cy="205" r="11" fill="#8E66FF"/>
    <circle cx="580" cy="250" r="11" fill="#8E66FF"/>
    <circle cx="740" cy="302" r="11" fill="#8E66FF"/>
    <circle cx="900" cy="352" r="11" fill="#8E66FF"/>
    <circle cx="1020" cy="380" r="11" fill="#8E66FF"/>
  </g>
</svg>
