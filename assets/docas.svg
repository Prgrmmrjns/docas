<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="DOCAS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F2A"/>
      <stop offset="55%" stop-color="#123447"/>
      <stop offset="100%" stop-color="#1A4A3A"/>
    </linearGradient>
    <linearGradient id="docas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#26C6A8"/>
      <stop offset="100%" stop-color="#00BFA5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="36" fill="url(#bg)"/>
  <circle cx="1040" cy="80" r="170" fill="#26C6A8" opacity="0.07"/>
  <circle cx="160" cy="400" r="190" fill="#7C4DFF" opacity="0.09"/>

  <!-- baseline (confounded): rising -->
  <path d="M160 320 C 360 300, 560 250, 760 200 S 980 150, 1080 130"
        fill="none" stroke="#FF6E6E" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="14 12" opacity="0.95"/>

  <!-- aligned / target: lowering -->
  <path d="M160 180 C 360 185, 560 240, 760 310 S 980 370, 1080 390"
        fill="none" stroke="url(#docas)" stroke-width="9" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- synthetic dots on aligned curve -->
  <g>
    <circle cx="260" cy="182" r="11" fill="#B388FF"/>
    <circle cx="420" cy="205" r="11" fill="#9B6FFF"/>
    <circle cx="580" cy="250" r="11" fill="#8A5CFF"/>
    <circle cx="740" cy="302" r="11" fill="#7C4DFF"/>
    <circle cx="900" cy="352" r="11" fill="#6A3DE0"/>
    <circle cx="1020" cy="380" r="11" fill="#5E35B1"/>
    <circle cx="260" cy="182" r="3.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="420" cy="205" r="3.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="580" cy="250" r="3.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="740" cy="302" r="3.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="900" cy="352" r="3.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="1020" cy="380" r="3.5" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
