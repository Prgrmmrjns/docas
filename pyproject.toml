[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docas"
version = "0.3.0"
description = "Dose-response curve alignment via synthetic augmentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jonas C. Wolber", email = "jwolber@ukaachen.de" }]
keywords = [
  "machine-learning",
  "counterfactual",
  "dose-response",
  "synthetic-data",
  "alignment",
  "forecasting",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
examples = ["scikit-learn>=1.4"]
dev = ["pytest>=8.0", "build", "twine", "scikit-learn>=1.4"]
docs = ["sphinx>=7", "furo>=2024.1"]

[project.urls]
Homepage = "https://github.com/Prgrmmrjns/docas"
Documentation = "https://prgrmmrjns.github.io/docas/"
Repository = "https://github.com/Prgrmmrjns/docas"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docas = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
